<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>SDA 초대 마감 안내</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; }
  body {
    font-family: 'Noto Sans KR', sans-serif;
    background: #f6f4f0; color: #2b2b2b;
    display: flex; align-items: center; justify-content: center;
    padding: 24px; box-sizing: border-box;
  }
  .card {
    max-width: 420px; width: 100%; background: #fff;
    border-radius: 16px; padding: 40px 28px; text-align: center;
    box-shadow: 0 2px 12px rgba(0,0,0,.06);
  }
  .tag { font-size: 14px; color: #8a7d6a; letter-spacing: .05em; }
  h1 { font-size: 24px; margin: 12px 0 16px; font-weight: 700; }
  p { font-size: 16px; line-height: 1.7; margin: 0; color: #555; }
</style>
</head>
<body>
  <div class="card">
    <div class="tag">서울도슨트협회 SDA</div>
    <h1>초대가 마감되었습니다</h1>
    <p>관심 가져주셔서 감사합니다.<br>다음 행사 소식으로 다시 찾아뵙겠습니다.</p>
  </div>
</body>
</html>
